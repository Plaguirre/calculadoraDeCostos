<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Crear cuenta — Calculadora de Costos</title>
  <link rel="icon" type="image/png" href="/sources/images/icono.png">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/js/common.js"></script>
  <script defer src="/js/auth-page.js"></script>
</head>
<body class="auth-body">
  <main class="auth-card">
    <a href="/" class="auth-brand">Calculadora de Costos</a>
    <h1>Crear cuenta</h1>
    <p class="auth-sub">Los insumos que ya cargaste se pasan a tu cuenta automáticamente.</p>
    <form id="authForm" data-mode="register" novalidate>
      <div class="form-group">
        <label for="name">Nombre <span class="optional">(opcional)</span></label>
        <input id="name" type="text" autocomplete="given-name" maxlength="100" autofocus />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="new-password" required minlength="8"
          aria-describedby="passHint" />
        <span class="hint" id="passHint">Mínimo 8 caracteres, con al menos una letra y un número.</span>
      </div>
      <div id="message" class="form-msg" role="alert" hidden></div>
      <button type="submit" class="btn btn--primary btn--full btn--lg">Crear cuenta</button>
    </form>
    <p class="auth-alt">¿Ya tenés cuenta? <a data-keep-next href="/login.html">Ingresar</a></p>
  </main>
</body>
</html>
