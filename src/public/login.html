<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ingresar — Calculadora de Costos</title>
  <link rel="icon" type="image/png" href="/sources/images/icono.png">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/js/common.js"></script>
  <script defer src="/js/auth-page.js"></script>
</head>
<body class="auth-body">
  <main class="auth-card">
    <a href="/" class="auth-brand">Calculadora de Costos</a>
    <h1>Iniciar sesión</h1>
    <p class="auth-sub">Guardá tus productos y armá tu catálogo.</p>
    <form id="authForm" data-mode="login" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required />
      </div>
      <div id="message" class="form-msg" role="alert" hidden></div>
      <button type="submit" class="btn btn--primary btn--full btn--lg">Entrar</button>
    </form>
    <p class="auth-alt">¿No tenés cuenta? <a data-keep-next href="/register.html">Registrate gratis</a></p>
  </main>
</body>
</html>
